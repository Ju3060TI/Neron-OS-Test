<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neron OS – Desktop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="desktop" id="desktop">

    <!-- WALLPAPER / ICONS -->
    <div class="wallpaper" id="wallpaper"></div>

    <!-- TASKBAR -->
    <div class="taskbar" id="taskbar">
        <div class="start-btn" id="startBtn">
            <span class="start-icon">⚡</span>
            <span class="start-label">Start</span>
        </div>
        <div class="task-items" id="taskItems"></div>
        <div class="clock" id="clock">12:00</div>
    </div>

    <!-- STARTMENÜ -->
    <div class="start-menu hidden" id="startMenu">
        <div class="start-header">⚡ NERON OS</div>
        <div class="start-apps">
            <div class="start-app" data-app="files">📁 Dateien</div>
            <div class="start-app" data-app="browser">🌐 Browser</div>
            <div class="start-app" data-app="settings">⚙️ Einstellungen</div>
            <div class="start-app" data-app="taskmanager">📊 Taskmanager</div>
            <div class="start-app" data-app="terminal">🖥️ Terminal</div>
        </div>
        <div class="start-footer">Neron OS v1.0</div>
    </div>

    <!-- WINDOW CONTAINER -->
    <div id="window-container"></div>

    <!-- NOTIFICATION -->
    <div class="notification hidden" id="notification">
        <span class="title" id="notiTitle">Info</span>
        <span id="notiText">Text</span>
        <span class="close-noti" id="notiClose">✕</span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
