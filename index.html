<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neron OS – Core Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="desktop" id="desktop">

    <!-- DESKTOP ICONS -->
    <div class="desktop-icon" data-app="files">
        <span class="icon">📁</span>
        <span class="label">Dateien</span>
    </div>
    <div class="desktop-icon" data-app="settings">
        <span class="icon">⚙️</span>
        <span class="label">Einstellungen</span>
    </div>
    <div class="desktop-icon" data-app="browser">
        <span class="icon">🌐</span>
        <span class="label">Browser</span>
    </div>
    <div class="desktop-icon" data-app="taskmanager">
        <span class="icon">📊</span>
        <span class="label">Taskmanager</span>
    </div>

    <!-- WINDOWS -->
    <div id="window-container"></div>

    <!-- NOTIFICATION -->
    <div class="notification hidden" id="notification">
        <span class="title" id="notiTitle">Info</span>
        <span id="notiText">Text</span>
        <span class="close-noti" id="notiClose">✕</span>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
